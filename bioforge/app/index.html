<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioForge</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --line:#26314c;
    --text:#e7ecf5; --dim:#93a0bd; --accent:#4f8cff; --accent2:#37d39b;
    --warn:#ffb454; --bad:#ff6b6b; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);
       color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{font-weight:700;font-size:18px;letter-spacing:.3px}
  .logo b{color:var(--accent)}
  .ver{font-size:12px;color:var(--dim);border:1px solid var(--line);
       border-radius:20px;padding:2px 9px;font-weight:600;letter-spacing:.2px}
  .badge{font-size:12px;color:var(--accent2);border:1px solid var(--accent2);
         border-radius:20px;padding:3px 10px;opacity:.9}
  .grow{flex:1}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
         padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);background:#223055}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:#3f7cf0}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{flex:1;display:flex;min-height:0}
  .side{width:300px;border-right:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  .side .nav{padding:10px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
         color:var(--dim);text-decoration:none;cursor:pointer;margin-bottom:4px}
  .nav a .ic{width:20px;text-align:center;font-size:15px;flex:none}
  .nav a.active{background:var(--panel2);color:var(--text)}
  .nav a:hover{color:var(--text)}
  .content{flex:1;overflow:auto;padding:22px 26px;min-width:0}
  h2{margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 20px;font-size:14px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px 18px;min-width:120px}
  .card .k{font-size:12px;color:var(--dim)}
  .card .v{font-size:22px;font-weight:700;margin-top:2px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
         height:100%;gap:16px;color:var(--dim);text-align:center}
  .empty .big{font-size:52px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--bg)}
  tr.pick{cursor:pointer}
  tr.pick:hover td{background:var(--panel)}
  table.seqtable{table-layout:fixed}
  .seqtable th:nth-child(1),.seqtable td:nth-child(1){width:46px}
  .seqtable th:nth-child(3),.seqtable td:nth-child(3){width:96px}
  .seqtable th:nth-child(4),.seqtable td:nth-child(4){width:74px}
  .seqtable td:nth-child(2),.seqtable td.prev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
  .tag.dna{color:#8ecbff;border-color:#2b4a70}
  .tag.prot{color:#c8a8ff;border-color:#4a3a70}
  .mono{font-family:"Cascadia Code",Consolas,monospace;font-size:13px}
  .seqbox{background:#0b0f1a;border:1px solid var(--line);border-radius:8px;padding:12px;
          overflow:auto;max-height:180px;white-space:pre-wrap;word-break:break-all;
          line-height:1.6}
  .aln{background:#0b0f1a;border:1px solid var(--line);border-radius:8px;padding:12px;
       overflow:auto;line-height:1.5}
  .aln .mm{color:var(--bad);font-weight:700}
  .aln .gap{color:var(--warn)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .hint{color:var(--dim);font-size:13px}
  .explain{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
           border-radius:10px;padding:12px 16px;margin:0 0 18px;color:#b9c4db;font-size:13.5px;line-height:1.65}
  .explain b{color:var(--text)}
  .explain .t{display:block;color:var(--text);font-weight:600;margin-bottom:4px;font-size:14px}
  .explain ul{margin:6px 0 0;padding-left:18px}
  .explain li{margin:2px 0}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  h3{margin:0 0 2px;font-size:15px}
  .codons{display:flex;gap:8px;flex-wrap:wrap}
  .codon{background:#0b0f1a;border:1px solid var(--line);border-radius:8px;padding:6px 9px;text-align:center;min-width:44px}
  .cbase{font-size:13px;letter-spacing:1px;color:var(--dim)}
  .carr{color:var(--dim);font-size:11px;line-height:1.1}
  .caa{font-size:17px;font-weight:700;font-family:"Cascadia Code",Consolas,monospace}
  .err{color:var(--bad);background:#2a1520;border:1px solid #52212e;padding:10px 14px;
       border-radius:8px;margin:10px 0}
  .soon{color:var(--dim);border:1px dashed var(--line);border-radius:var(--radius);
        padding:30px;text-align:center}
  .selbar{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
          padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .tabs{display:flex;gap:6px;align-items:center;padding:7px 16px;background:var(--panel);
        border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs:empty{display:none}
  .tab{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
       border:1px solid var(--line);background:var(--panel2);cursor:pointer;
       white-space:nowrap;font-size:13px;max-width:260px}
  .tab.active{border-color:var(--accent);background:#223055}
  .tab .fn{overflow:hidden;text-overflow:ellipsis}
  .tab .n{color:var(--dim);font-size:12px}
  .tab .x{color:var(--dim);padding:0 2px;border-radius:4px}
  .tab .x:hover{color:var(--bad);background:#2a1520}
</style>
</head>
<body>
<header>
  <div class="logo"><b>Bio</b>Forge</div>
  <span class="ver">v10.0</span>
  <span class="badge">● local · sin conexión · privado</span>
  <div class="grow"></div>
  <button class="primary" id="openBtn" disabled>Abrir archivo…</button>
</header>

<div id="tabs" class="tabs"></div>

<main>
  <nav class="side">
    <div class="nav" id="nav">
      <a data-view="inicio" class="active"><span class="ic">🏠</span>Inicio</a>
      <a data-view="secuencias"><span class="ic">🧬</span>Secuencias</a>
      <a data-view="calidad"><span class="ic">📊</span>Calidad</a>
      <a data-view="alinear"><span class="ic">⚗️</span>Alinear</a>
      <a data-view="variantes"><span class="ic">🔍</span>Variantes</a>
      <a data-view="arbol"><span class="ic">🌳</span>Árbol</a>
      <a data-view="lab"><span class="ic">✂️</span>Laboratorio</a>
      <a data-view="nanoporo"><span class="ic">〜</span>Nanoporo</a>
      <a data-view="evolucion"><span class="ic">🔮</span>Evolución</a>
    </div>
  </nav>
  <section class="content" id="content"></section>
</main>

<script>
let API = null;                        // window.pywebview.api cuando esté listo
let STATE = {workspace:null, summary:null};  // archivos abiertos + resumen del activo
let VIEW = "inicio";
const $ = (s,el=document)=>el.querySelector(s);
const el = (h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};
const esc = (s)=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const explain = (html)=>el(`<div class="explain">${html}</div>`);

// Conecta con Python de forma PACIENTE: el motor de render de Windows (WebView2)
// puede tardar varios segundos en exponer el puente, y a veces el evento se pierde.
// Por eso se sondea window.pywebview.api hasta 15 s, además de escuchar el evento.
function ready(fn){
  let done=false;
  const go=()=>{ if(done||!(window.pywebview&&window.pywebview.api))return; done=true; API=window.pywebview.api; fn(); };
  if(window.pywebview && window.pywebview.api){ go(); return; }
  window.addEventListener("pywebviewready",go);
  let n=0; const iv=setInterval(()=>{
    if(done){ clearInterval(iv); return; }
    if(window.pywebview && window.pywebview.api){ clearInterval(iv); go(); }
    else if(++n>75){ clearInterval(iv); toast("No se pudo conectar con Python tras 15 s. Cierra la app y vuelve a abrir BioForge.bat; si sigue igual, dímelo."); }
  },200);
}

// ── navegación ────────────────────────────────────────────────────────────
$("#nav").addEventListener("click",e=>{
  const a=e.target.closest("a"); if(!a)return;
  document.querySelectorAll("#nav a").forEach(x=>x.classList.remove("active"));
  a.classList.add("active"); VIEW=a.dataset.view; render();
});
function setActiveNav(v){ document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("active",x.dataset.view===v)); }

$("#openBtn").addEventListener("click",async()=>{
  try{
    if(!API){ toast("El puente con Python aún no está listo. Espera un segundo y reinténtalo."); return; }
    if(typeof API.pick_and_open!=="function"){ toast("El puente no expone 'pick_and_open' (revisar backend)."); return; }
    const ws=await API.pick_and_open();
    if(ws===undefined||ws===null){ toast("El diálogo de archivos no devolvió nada (create_file_dialog vacío)."); return; }
    if(ws.cancelled) return;
    if(ws.error){ toast(ws.error); return; }
    STATE.workspace=ws;
    STATE.summary=await API.summary();
    VIEW="secuencias"; setActiveNav("secuencias");
    renderTabs(); render();
  }catch(e){ toast("Error al abrir: "+(e&&e.message?e.message:String(e))); }
});

// carga un pequeño FASTA de ejemplo (generado por el backend) para probar sin buscar archivos
async function openExample(){
  try{
    if(!API){ toast("El puente con Python aún no está listo. Espera un segundo y reinténtalo."); return; }
    if(typeof API.open_example!=="function"){ toast("El puente no expone 'open_example' (revisar backend)."); return; }
    const ws=await API.open_example();
    if(!ws||ws.error){ toast(ws&&ws.error?ws.error:"no se pudo cargar el ejemplo"); return; }
    STATE.workspace=ws;
    STATE.summary=await API.summary();
    VIEW="secuencias"; setActiveNav("secuencias");
    renderTabs(); render();
  }catch(e){ toast("Error al cargar el ejemplo: "+(e&&e.message?e.message:String(e))); }
}

// barra de pestañas: los archivos abiertos, el activo resaltado, × para cerrar
async function renderTabs(){
  const bar=$("#tabs"), ws=STATE.workspace;
  if(!ws || !ws.files || !ws.files.length){ bar.replaceChildren(); return; }
  bar.replaceChildren();
  ws.files.forEach(f=>{
    const t=el(`<div class="tab ${f.active?"active":""}" title="${esc(f.filename)} · ${f.count} secuencias">
      <span class="fn">${esc(f.filename)}</span><span class="n">${f.count}</span>
      <span class="x" title="Cerrar">×</span></div>`);
    t.addEventListener("click",async e=>{
      if(e.target.classList.contains("x")){
        e.stopPropagation();
        STATE.workspace=await API.close_file(f.index);
        STATE.summary=await API.summary();
        renderTabs(); render(); return;
      }
      STATE.summary=await API.select_file(f.index);
      STATE.workspace=await API.workspace();
      renderTabs(); render();
    });
    bar.append(t);
  });
}

function toast(msg){ const c=$("#content"); c.prepend(el(`<div class="err">${esc(msg)}</div>`)); }

// ── vistas ─────────────────────────────────────────────────────────────────
function render(){
  const c=$("#content");
  if(VIEW==="inicio")      return c.replaceChildren(viewInicio());
  if(VIEW==="secuencias")  return renderSecuencias(c);
  if(VIEW==="calidad")     return renderCalidad(c);
  if(VIEW==="alinear")     return renderAlinear(c);
  if(VIEW==="variantes")   return renderVariantes(c);
  if(VIEW==="arbol")       return renderArbol(c);
  if(VIEW==="lab")         return renderLab(c);
  if(VIEW==="nanoporo")    return renderNanoporo(c);
  if(VIEW==="evolucion")   return renderEvolucion(c);
}

function viewInicio(){
  const s=STATE.summary;
  const box=el(`<div></div>`);
  box.append(el(`<h2>Bienvenido a BioForge</h2>`));
  box.append(el(`<p class="sub">Un motor bioinformático que corre entero en tu ordenador. Tus datos no salen de aquí.</p>`));
  box.append(explain(`<span class="t">¿Qué es esto?</span>
    El <b>ADN</b> es el manual de instrucciones de todo ser vivo, escrito con solo 4 letras (A, C, G, T). Este programa lee esos archivos de letras y te deja <b>explorarlos y analizarlos con clics</b>, sin escribir código. Cada pestaña de la izquierda hace una cosa:
    <ul>
      <li><b>Secuencias</b> — mira las secuencias que cargaste (su tipo y tamaño).</li>
      <li><b>Calidad</b> — si vienen de una máquina de secuenciación, mide cómo de fiables son las letras.</li>
      <li><b>Alinear</b> — compara dos secuencias y ve en qué se diferencian (mutaciones).</li>
      <li><b>Variantes</b> — compara MUCHAS lecturas contra un genoma y encuentra sus mutaciones.</li>
      <li><b>Árbol</b> — reconstruye el parentesco evolutivo entre varias secuencias.</li>
      <li><b>Laboratorio</b> — enzimas que cortan, genes candidatos y cebadores de PCR.</li>
      <li><b>Nanoporo</b> — convierte la señal eléctrica cruda de un secuenciador en letras de ADN.</li>
      <li><b>Evolución</b> — predice qué mutaciones de una proteína podrían extenderse con el tiempo.</li>
    </ul>`));
  if(!s){
    box.append(el(`<div class="empty"><div class="big">🧬</div>
      <div>Abre un archivo FASTA/FASTQ para empezar</div>
      <div class="row" style="justify-content:center;margin:4px 0 0">
        <button class="primary" onclick="document.getElementById('openBtn').click()">Abrir archivo…</button>
        <button onclick="openExample()">Probar con un ejemplo</button>
      </div>
      <p class="hint" style="margin:0;max-width:430px">¿Nunca has usado esto? Pulsa <b>"Probar con un ejemplo"</b> y cargarás unas secuencias de ADN de muestra que puedes explorar, traducir y comparar al instante.</p></div>`));
  }else{
    box.append(summaryCards(s));
    box.append(el(`<p class="hint">Archivo cargado: <b>${esc(s.filename)}</b>. Ve a <b>Secuencias</b> para explorarlo.</p>`));
  }
  return box;
}

function summaryCards(s){
  const wrap=el(`<div class="cards"></div>`);
  const card=(k,v)=>el(`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`);
  wrap.append(card("Secuencias",s.count));
  wrap.append(card("ADN",s.nucleotide));
  wrap.append(card("Proteína",s.protein));
  wrap.append(card("Símbolos",s.total_symbols.toLocaleString()));
  wrap.append(card("Longitud media",s.mean_len));
  return wrap;
}

async function renderSecuencias(c){
  if(!STATE.summary){ c.replaceChildren(el(`<div class="empty"><div class="big">📄</div><div>Aún no hay archivo. Pulsa "Abrir archivo…".</div></div>`)); return; }
  const page=await API.records_page(0,500);
  // se construye la TABLA ENTERA como un solo string: un <tr> suelto lo descarta el
  // navegador (solo vale dentro de <table>), por eso antes se amontonaban las filas.
  const rows=page.items.map(it=>{
    const tag=it.type==="ADN"?`<span class="tag dna">ADN</span>`:`<span class="tag prot">proteína</span>`;
    return `<tr class="pick" data-index="${it.index}"><td>${it.index}</td><td>${esc(it.header)}</td>`
         + `<td>${tag}</td><td>${it.length}</td><td class="mono prev">${esc(it.preview)}…</td></tr>`;
  }).join("");
  const table=el(`<table class="seqtable"><thead><tr><th>#</th><th>Nombre</th><th>Tipo</th><th>Largo</th><th>Vista previa</th></tr></thead><tbody>${rows}</tbody></table>`);
  c.replaceChildren(
    el(`<h2>Secuencias</h2>`),
    el(`<p class="sub">${STATE.summary.count} en <b>${esc(STATE.summary.filename)}</b></p>`),
    explain(`<span class="t">¿Qué es una secuencia?</span>
      Una <b>secuencia</b> es una tira de letras que representa una molécula biológica:
      <ul>
        <li><b>ADN</b> — las 4 letras A, C, G, T. Es el manual de instrucciones de la célula.</li>
        <li><b>Proteína</b> — 20 letras (una por aminoácido). Es lo que el ADN "fabrica" y hace el trabajo en el cuerpo.</li>
      </ul>
      La tabla lista cada secuencia del archivo con su <b>tipo</b>, su <b>tamaño</b> (nº de letras) y una vista previa. <b>Haz clic en una fila</b> para ver su composición y, si es ADN, traducirla a proteína.`),
    summaryCards(STATE.summary), table, el(`<div id="detail"></div>`));
  table.querySelectorAll("tbody tr").forEach(tr=>
    tr.addEventListener("click",()=>showDetail(+tr.dataset.index)));
}

async function showDetail(index){
  const d=await API.sequence_detail(index);
  const box=$("#detail"); if(!box)return;
  if(d.error){box.replaceChildren(el(`<div class="err">${esc(d.error)}</div>`));return;}
  const comp=Object.entries(d.composition).map(([k,v])=>`${k}:${v}`).join("  ");
  box.replaceChildren(el(`
    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px">
      <h2>#${index} · ${esc(d.header)}</h2>
      <p class="sub">${d.type} · ${d.length} símbolos · composición: <span class="mono">${esc(comp)}</span></p>
      <div class="row">
        ${d.type==="ADN"?`<button class="primary" id="trBtn">Traducir a proteína</button>`:``}
      </div>
      <div class="seqbox mono">${esc(d.sequence)}</div>
      <div id="tr"></div>
    </div>`));
  const b=$("#trBtn");
  if(b) b.addEventListener("click",async()=>{
    const r=await API.translate(index);
    const o=$("#tr");
    if(r.error){ o.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
    o.replaceChildren(el(`
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
        <h3>Proteína · ${r.length} aminoácidos</h3>
        <p class="hint">Traducir convierte el ADN en proteína: la célula lee el ADN <b>de 3 en 3 letras</b> (cada trío es un <b>codón</b>) y cada codón nombra un <b>aminoácido</b>. Encadenados, los aminoácidos forman la proteína — la molécula que hace el trabajo en el cuerpo. Cada letra de abajo es un aminoácido, coloreado por su tipo:</p>
        <div class="row" style="gap:6px;margin:6px 0 4px">${aaLegend()}</div>
        <div class="seqbox mono">${colorProtein(r.protein)}</div>
        ${(r.codons&&r.codons.length)?`
          <h3 style="margin-top:16px">Cómo se lee (primeros codones)</h3>
          <p class="hint" style="margin:0 0 8px">Cada trío de letras de ADN → un aminoácido:</p>
          <div class="codons">${r.codons.slice(0,12).map(codonCell).join("")}</div>`:``}
      </div>`));
  });
}
// ── aminoácidos: color por tipo, nombres y helpers educativos ─────────────────
const AA_GROUP={A:"hidro",V:"hidro",L:"hidro",I:"hidro",M:"hidro",F:"hidro",W:"hidro",P:"hidro",G:"hidro",
  S:"polar",T:"polar",C:"polar",Y:"polar",N:"polar",Q:"polar",K:"pos",R:"pos",H:"pos",D:"neg",E:"neg","*":"stop"};
const AA_COLOR={hidro:"#8ecbff",polar:"#37d39b",pos:"#b58cff",neg:"#ff8c8c",stop:"#93a0bd",otro:"#cbd3e6"};
const AA_LABEL={hidro:"hidrofóbico",polar:"polar",pos:"carga +",neg:"carga −",stop:"fin"};
const AA_NAME={A:"Alanina",R:"Arginina",N:"Asparagina",D:"Ácido aspártico",C:"Cisteína",E:"Ácido glutámico",
  Q:"Glutamina",G:"Glicina",H:"Histidina",I:"Isoleucina",L:"Leucina",K:"Lisina",M:"Metionina",F:"Fenilalanina",
  P:"Prolina",S:"Serina",T:"Treonina",W:"Triptófano",Y:"Tirosina",V:"Valina","*":"fin (stop)"};
function aaColor(a){ return AA_COLOR[AA_GROUP[a]||"otro"]; }
function colorProtein(p){ return [...p].map(a=>`<span title="${a} · ${esc(AA_NAME[a]||a)}" style="color:${aaColor(a)}">${a}</span>`).join(""); }
function aaLegend(){ return Object.entries(AA_LABEL).map(([g,lab])=>`<span class="tag" style="color:${AA_COLOR[g]};border-color:${AA_COLOR[g]}">${lab}</span>`).join(" "); }
function codonCell(c){ return `<div class="codon"><div class="mono cbase">${esc(c.codon)}</div><div class="carr">↓</div><div class="caa" style="color:${aaColor(c.aa)}" title="${esc(AA_NAME[c.aa]||c.aa)}">${esc(c.aa)}</div></div>`; }

async function renderAlinear(c){
  if(!STATE.summary){ c.replaceChildren(el(`<div class="empty"><div class="big">🧬</div><div>Carga un archivo con al menos 2 secuencias.</div></div>`)); return; }
  const page=await API.records_page(0,500);
  const opts=page.items.map(it=>`<option value="${it.index}">#${it.index} · ${esc(it.header)} (${it.length})</option>`).join("");
  c.replaceChildren(el(`<h2>Alinear dos secuencias</h2>`),
    explain(`<span class="t">¿Qué es alinear?</span>
      Es poner dos secuencias <b>una encima de otra</b> para ver en qué se parecen y en qué se diferencian — como comparar dos textos casi iguales.
      <ul>
        <li><b>Identidad</b> — el % de posiciones que coinciden (100% = idénticas).</li>
        <li><b>Sustitución</b> — una letra cambiada por otra (<span style="color:#ff6b6b">en rojo</span>).</li>
        <li><b>Inserción / deleción</b> — a una secuencia le sobra o le falta una letra: un hueco (<span style="color:#ffb454">en naranja</span>).</li>
      </ul>
      Esas diferencias son las <b>mutaciones</b>. Elige dos secuencias abajo y pulsa Alinear.`));
  const bar=el(`<div class="selbar">
     <span>A</span><select id="selA">${opts}</select>
     <span>B</span><select id="selB">${opts}</select>
     <button class="primary" id="alnBtn">Alinear</button></div>`);
  c.append(bar);
  c.append(el(`<div id="alnOut"></div>`));
  if(page.items.length>1) $("#selB",bar).selectedIndex=1;
  $("#alnBtn",bar).addEventListener("click",async()=>{
    const i=+$("#selA").value, j=+$("#selB").value;
    const out=$("#alnOut"); out.replaceChildren(el(`<p class="hint">Alineando…</p>`));
    const r=await API.align(i,j);
    if(r.error){out.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`));return;}
    out.replaceChildren(el(`
      <div class="cards">
        <div class="card"><div class="k">Identidad</div><div class="v">${r.identity}%</div></div>
        <div class="card"><div class="k">Mutaciones</div><div class="v">${r.n_mutations}</div></div>
        <div class="card"><div class="k">Longitud</div><div class="v">${r.length}</div></div>
      </div>
      <p class="hint" style="margin:2px 0 6px">Fila A arriba, fila B abajo. En <span style="color:#ff6b6b">rojo</span> las letras que difieren; en <span style="color:#ffb454">naranja</span> los huecos (falta/sobra una letra). Todo lo demás coincide.</p>
      <div class="aln mono">${colorAln(r.aligned_a,r.aligned_b)}</div>`));
  });
}

function colorAln(a,b){
  let A="",B="";
  for(let i=0;i<a.length;i++){
    const ca=a[i],cb=b[i];
    if(ca==="-"||cb==="-"){A+=`<span class="gap">${ca}</span>`;B+=`<span class="gap">${cb}</span>`;}
    else if(ca!==cb){A+=`<span class="mm">${ca}</span>`;B+=`<span class="mm">${cb}</span>`;}
    else{A+=ca;B+=cb;}
  }
  return `A  ${A}\nB  ${B}`;
}

// ── Variantes (lecturas vs genoma de referencia → mutaciones) ────────────────
async function renderVariantes(c){
  const box=el(`<div></div>`);
  box.append(el(`<h2>Variantes · ¿qué cambió?</h2>`),
    el(`<p class="sub">Compara muchas lecturas contra un genoma de referencia y encuentra sus mutaciones.</p>`),
    explain(`<span class="t">¿Qué es esto?</span>
      Cuando se secuencia una muestra (un virus, una bacteria, una persona), la máquina no devuelve el genoma entero de una pieza: devuelve <b>muchísimos trozos cortos</b> llamados <b>lecturas</b>. Para saber qué tiene esa muestra de distinto, se colocan todas las lecturas sobre un <b>genoma de referencia</b> ya conocido y se mira en qué posiciones discrepan.
      <ul>
        <li><b>Cobertura</b> (o profundidad) — cuántas lecturas pasan por cada punto del genoma. Cuantas más, más seguridad. Con menos de 5 no nos fiamos.</li>
        <li><b>Variante</b> — una posición donde la muestra dice algo distinto a la referencia: una <b>sustitución</b> (letra cambiada), una <b>inserción</b> (letras de más) o una <b>deleción</b> (letras de menos).</li>
        <li><b>Calidad (Q)</b> — cuánta confianza hay. Q20 = 100 veces más probable que sea real que un error; Q30 = mil veces.</li>
        <li><b>Frecuencia</b> — qué proporción de las lecturas la lleva. 100% = todas; 30% = solo un tercio de la población.</li>
      </ul>
      El resultado se puede guardar en <b>VCF</b>, el formato estándar que usan los laboratorios de todo el mundo.`));

  const ws=STATE.workspace;
  if(!ws || !ws.files || ws.files.length<2){
    box.append(el(`<div class="soon">Para buscar variantes necesitas <b>dos archivos abiertos</b>:<br>
      un <b>genoma de referencia</b> (FASTA) y las <b>lecturas</b> (FASTQ o FASTA).<br><br>
      Pulsa "Abrir archivo…" arriba y carga los dos.</div>`));
    c.replaceChildren(box); return;
  }

  const src=await API.variant_sources();
  if(src.error){ box.append(el(`<div class="err">${esc(src.error)}</div>`)); c.replaceChildren(box); return; }

  const opt=(f)=>`<option value="${f.index}">${esc(f.filename)} (${f.count} sec.)</option>`;
  const refSug=(src.files.find(f=>!f.looks_like_reads)||src.files[0]).index;
  const readSug=(src.files.find(f=>f.looks_like_reads&&f.index!==refSug)||
                 src.files.find(f=>f.index!==refSug)||src.files[0]).index;

  const bar=el(`<div class="selbar" style="flex-wrap:wrap">
     <span>Referencia</span><select id="refFile">${src.files.map(opt).join("")}</select>
     <select id="refSeq"><option>cargando…</option></select>
     <span style="margin-left:8px">Lecturas</span><select id="readFile">${src.files.map(opt).join("")}</select>
     <button class="primary" id="goVar">Buscar mutaciones</button></div>`);
  box.append(bar);

  const inp="width:78px;background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px";
  const avz=el(`<details style="margin:0 0 14px">
      <summary class="hint" style="cursor:pointer">Ajustes avanzados</summary>
      <div class="row" style="margin:10px 0 0">
        <label class="hint">Profundidad mínima <input id="vDepth" type="number" value="5" min="1" style="${inp}"></label>
        <label class="hint">Frecuencia mínima <input id="vAf" type="number" value="0.2" step="0.05" min="0.01" max="1" style="${inp}"></label>
        <label class="hint">Error del secuenciador <input id="vErr" type="number" value="0.01" step="0.01" min="0.001" max="0.5" style="${inp}"></label>
      </div>
      <p class="hint" style="margin:8px 0 0">Si tus lecturas son de <b>nanoporo</b> (más ruidosas), sube el error a <b>0.05</b>: es lo que evita mutaciones falsas. Baja la frecuencia mínima para buscar variantes minoritarias.</p>
    </details>`);
  box.append(avz, el(`<div id="varOut"></div>`));
  c.replaceChildren(box);

  $("#refFile",bar).value=String(refSug);
  $("#readFile",bar).value=String(readSug);

  async function cargarSecs(){
    const o=await API.reference_options(+$("#refFile").value);
    const sel=$("#refSeq");
    if(o.error||!o.options||!o.options.length){ sel.innerHTML=`<option value="0">—</option>`; return; }
    sel.innerHTML=o.options.map(x=>`<option value="${x.index}">${esc(x.header)} (${x.length.toLocaleString()} pb)</option>`).join("");

  await cargarSecs();

  $("#goVar",bar).addEventListener("click",async()=>{
    const out=$("#varOut");
    out.replaceChildren(el(`<p class="hint">Mapeando lecturas y buscando mutaciones… (es cálculo real, puede tardar unos segundos)</p>`));
    const r=await API.call_variants_app(
      +$("#refFile").value, +($("#refSeq").value||0), +$("#readFile").value,
      +$("#vDepth").value, +$("#vAf").value, +$("#vErr").value);
    if(r.error){ out.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
    pintarVariantes(out,r);

}

function pintarVariantes(out,r){

    <p class="hint" style="margin:0 0 8px">Cuántas lecturas pasan por cada punto. Los valles son zonas con menos evidencia — ahí el programa prefiere callarse antes que arriesgar.</p>
    <div class="chart">${svgDepth(r.depth_series,r.depth_step)}</div>
    <p class="hint" style="margin:10px 0 0">Cubierto por al menos… ≥1×: <b>${r.coverage["1"]}%</b> · ≥5×: <b>${r.coverage["5"]}%</b> · ≥10×: <b>${r.coverage["10"]}%</b> · ≥30×: <b>${r.coverage["30"]}%</b> del genoma</p>
    <div class="row" style="margin-top:18px"><h3 style="margin:0;flex:1">Mutaciones encontradas (${r.n_snv} sustituciones, ${r.n_indel} indels)</h3>

      ? `<table class="seqtable"><thead><tr><th>Posición</th><th>Cambio</th><th>Tipo</th><th>Calidad</th><th>Lecturas</th><th>Frecuencia</th></tr></thead><tbody>${filas}</tbody></table>`

    <p class="hint" style="margin-top:12px">Cada mutación se decide comparando dos posibilidades: que sea un <b>error del secuenciador</b> o que sea <b>real</b>. La "calidad" mide cuántas veces más probable es lo segundo. Los indels largos pueden salir partidos en varios trozos: es una limitación conocida de nuestro alineador, no un fallo de tus datos.</p>

function svgDepth(vals,paso){
  const w=720,h=190,L=48,B=26,T=10,R=14,n=vals.length; if(!n) return "";
  const mx=Math.max(...vals,1);
  const X=i=>L+i*(w-L-R)/Math.max(n-1,1), Y=v=>T+(mx-v)*(h-T-B)/mx;
  const linea=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${X(0).toFixed(1)},${(h-B).toFixed(1)} ${linea} ${X(n-1).toFixed(1)},${(h-B).toFixed(1)}`;
  const yt=[0,Math.round(mx/2),mx].map(v=>
    `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${w-R}" y2="${Y(v).toFixed(1)}" stroke="#26314c"/>`
   +`<text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" fill="#93a0bd" font-size="11" text-anchor="end">${v}×</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">
    ${yt}<polygon points="${area}" fill="#4f8cff" opacity="0.18"/>
    <polyline points="${linea}" fill="none" stroke="#4f8cff" stroke-width="1.6"/>
    <text x="${w/2}" y="${h-4}" fill="#93a0bd" font-size="11" text-anchor="middle">posición en el genoma (1 punto ≈ ${paso} bases)</text></svg>`;
}

// ── Árbol evolutivo (filogenia por distancias) ──────────────────────────────
async function renderArbol(c){
  const box=el(`<div></div>`);
  box.append(el(`<h2>Árbol evolutivo</h2>`),
    el(`<p class="sub">¿Quién se parece a quién, y en qué orden se separaron?</p>`),
    explain(`<span class="t">¿Qué es esto?</span>
      Un <b>árbol evolutivo</b> (o filogenético) ordena un grupo de secuencias según su parentesco: las que están unidas por una rama cercana comparten un antepasado más reciente. Es la forma en que la biología reconstruye historias que nadie presenció.
      <ul>
        <li><b>Cómo se hace</b> — primero se mide cuánto se diferencian todas las parejas; luego se busca el árbol que mejor explica esas distancias.</li>
        <li><b>Corrección de saturación</b> — contar letras distintas se queda corto: en mucho tiempo, una posición puede mutar y <b>volver</b> a su letra original. El modelo <b>Jukes-Cantor</b> estima esas mutaciones invisibles.</li>
        <li><b>Longitud de la rama</b> — cuánto cambio acumuló ese linaje. Ramas largas = evolución más rápida o más tiempo.</li>
        <li><b>Soporte (bootstrap)</b> — el número sobre cada nudo. Se reconstruye el árbol cientos de veces con trozos al azar del alineamiento y se cuenta cuántas veces sale esa misma agrupación. <b>Es lo más importante:</b> un árbol sin soporte es una opinión.</li>
      </ul>
      <b>Cómo leerlo con honestidad:</b> ≥95 % es sólido · 70-95 % razonable · <b>por debajo de 70 % los datos no lo sostienen</b>, y esa agrupación no debería contarse como resultado.`));

  if(!STATE.summary){
    box.append(el(`<div class="soon">Carga un archivo FASTA con <b>al menos 3 secuencias emparentadas</b>.<br>
      Prueba con <b>ejemplos/filogenia_especies.fasta</b>.</div>`));
    c.replaceChildren(box); return;
  }
  if(STATE.summary.count<3){
    box.append(el(`<div class="err">Este archivo solo tiene ${STATE.summary.count} secuencia(s). Un árbol necesita al menos 3.</div>`));
    c.replaceChildren(box); return;
  }

  const bar=el(`<div class="selbar" style="flex-wrap:wrap">
     <span>Método</span>
     <select id="phMethod">
       <option value="nj">Neighbor-Joining (recomendado)</option>
       <option value="upgma">UPGMA (supone ritmo constante)</option>
     </select>
     <span style="margin-left:8px">Modelo</span>
     <select id="phModel">
       <option value="jc">Jukes-Cantor</option>
       <option value="k2p">Kimura 2 parámetros (ADN)</option>
       <option value="p">Sin corregir</option>
       <option value="poisson">Poisson (proteínas)</option>
     </select>
     <span style="margin-left:8px">Bootstrap</span>
     <select id="phBoot">
       <option value="0">sin soporte (rápido)</option>
       <option value="100" selected>100 réplicas</option>
       <option value="500">500 réplicas (lento)</option>
     </select>
     <button class="primary" id="goPhylo">Construir árbol</button></div>`);
  box.append(bar, el(`<div id="phyOut"></div>`));
  c.replaceChildren(box);

  $("#goPhylo",bar).addEventListener("click",async()=>{
    const out=$("#phyOut");
    out.replaceChildren(el(`<p class="hint">Alineando, midiendo distancias y construyendo el árbol… (con bootstrap puede tardar unos segundos)</p>`));
    const r=await API.phylo_tree($("#phMethod").value,$("#phModel").value,+$("#phBoot").value);
    if(r.error){ out.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
    pintarArbol(out,r);
  });
}

function svgArbol(raiz,conSoporte){
  // 1) posiciones: x = distancia acumulada desde la raíz, y = orden de las hojas
  const hojas=[]; let maxX=0;
  (function medir(n,x){
    n._x=x; if(x>maxX) maxX=x;
    if(!n.children||!n.children.length){ n._hoja=true; hojas.push(n); return; }
    n.children.forEach(h=>medir(h,x+(h.length||0)));
  })(raiz,0);
  if(!hojas.length) return "";
  hojas.forEach((h,i)=>h._y=i);
  (function centrar(n){
    if(n._hoja) return n._y;
    const ys=n.children.map(centrar);
    n._y=(Math.min(...ys)+Math.max(...ys))/2; return n._y;
  })(raiz);

  // si todas las ramas miden ~0, se dibuja por topología (cladograma)
  if(maxX<1e-9){
    (function prof(n,d){ n._x=d; if(d>maxX)maxX=d; (n.children||[]).forEach(h=>prof(h,d+1)); })(raiz,0);
  }

  const filas=hojas.length, alto=Math.max(150,filas*26+40);
  const L=14, R=190, T=22, B=14, ancho=760;
  const usable=ancho-L-R;
  const X=v=>L+(maxX>0?(v/maxX)*usable:0);
  const Y=v=>T+v*((alto-T-B)/Math.max(filas-1,1));

  const trazos=[];
  (function dibujar(n){
    if(n._hoja) return;
    const ys=n.children.map(h=>h._y);
    // conector vertical que une a todos los hijos
    trazos.push(`<line x1="${X(n._x).toFixed(1)}" y1="${Y(Math.min(...ys)).toFixed(1)}" x2="${X(n._x).toFixed(1)}" y2="${Y(Math.max(...ys)).toFixed(1)}" stroke="#5a6a8c" stroke-width="1.6"/>`);
    n.children.forEach(h=>{
      trazos.push(`<line x1="${X(n._x).toFixed(1)}" y1="${Y(h._y).toFixed(1)}" x2="${X(h._x).toFixed(1)}" y2="${Y(h._y).toFixed(1)}" stroke="#5a6a8c" stroke-width="1.6"/>`);
      dibujar(h);
    });
    if(conSoporte && n.support!==undefined && n!==raiz){
      const col=n.support>=95?"#37d39b":(n.support>=70?"#ffb454":"#ff6b6b");
      trazos.push(`<text x="${(X(n._x)+4).toFixed(1)}" y="${(Y(n._y)-4).toFixed(1)}" fill="${col}" font-size="11" font-weight="600">${n.support.toFixed(0)}</text>`);
    }
  })(raiz);

  const etiquetas=hojas.map(h=>
    `<circle cx="${X(h._x).toFixed(1)}" cy="${Y(h._y).toFixed(1)}" r="3" fill="#4f8cff"/>`
   +`<text x="${(X(h._x)+8).toFixed(1)}" y="${(Y(h._y)+4).toFixed(1)}" fill="#e7ecf5" font-size="12.5">${esc(h.name)}</text>`).join("");

  // barra de escala: una referencia de cuánto cambio representa la distancia
  const paso=maxX>0?Math.pow(10,Math.floor(Math.log10(maxX/3))):0;
  const escala=paso>0?`<line x1="${L}" y1="${alto-4}" x2="${(L+(paso/maxX)*usable).toFixed(1)}" y2="${alto-4}" stroke="#93a0bd" stroke-width="1.5"/>`
    +`<text x="${(L+(paso/maxX)*usable+6).toFixed(1)}" y="${alto-1}" fill="#93a0bd" font-size="10.5">${paso} sustituciones/sitio</text>`:"";

  return `<svg viewBox="0 0 ${ancho} ${alto+8}" width="100%" preserveAspectRatio="xMinYMin meet">${trazos.join("")}${etiquetas}${escala}</svg>`;
}

let LAB_SUB = "enzimas";

async function renderLab(c){
  const box=el(`<div></div>`);
  box.append(el(`<h2>Laboratorio</h2>`),
    el(`<p class="sub">Las tres preguntas de antes de tocar una pipeta.</p>`),
    explain(`<span class="t">¿Para qué sirve esto?</span>
      Son las herramientas del día a día en un laboratorio de biología molecular — las que normalmente se resuelven a mano o subiendo la secuencia a una web ajena. Aquí van en tu ordenador, sin que los datos salgan.
      <ul>
        <li><b>Enzimas de restricción</b> — tijeras moleculares. Cada una reconoce una secuencia corta y corta ahí. Son la base de la <b>clonación</b>: recortar un gen de un sitio y pegarlo en otro. Lo que más se busca son las que cortan <b>una sola vez</b>: permiten abrir la secuencia por un punto conocido sin romperla en trozos.</li>
        <li><b>Genes candidatos (ORFs)</b> — tramos que podrían codificar una proteína: empiezan en <b>ATG</b>, siguen de tres en tres y acaban en una señal de parada. Se buscan en los <b>seis marcos</b> posibles (dos hebras × tres puntos de arranque), porque un gen puede estar en cualquiera.</li>
        <li><b>Cebadores de PCR</b> — la PCR copia millones de veces un trozo concreto de ADN, y los cebadores marcan dónde empieza y dónde acaba. Diseñarlos mal es la causa nº1 de que una PCR falle; lo crítico es que los dos tengan <b>temperatura de fusión (Tm) parecida</b>, o uno se pega y el otro no.</li>
      </ul>`));

  if(!STATE.summary){
    box.append(el(`<div class="soon">Carga una secuencia de ADN.<br>Prueba con <b>ejemplos/laboratorio_plasmido.fasta</b>.</div>`));
    c.replaceChildren(box); return;
  }

  const page=await API.records_page(0,300);
  const opts=page.items.filter(x=>x.type==="ADN")
    .map(x=>`<option value="${x.index}">#${x.index} · ${esc(x.header)} (${x.length.toLocaleString()} pb)</option>`).join("");
  if(!opts){
    box.append(el(`<div class="err">Este archivo no tiene secuencias de ADN (las herramientas de laboratorio son de ADN).</div>`));
    c.replaceChildren(box); return;
  }

  const tabs=el(`<div class="row" style="gap:6px;margin:0 0 14px">
    <button id="tEnz" class="${LAB_SUB==="enzimas"?"primary":""}">✂️ Enzimas</button>
    <button id="tOrf" class="${LAB_SUB==="orfs"?"primary":""}">🧬 Genes (ORFs)</button>
    <button id="tPri" class="${LAB_SUB==="primers"?"primary":""}">🔬 Cebadores</button>
    <span style="flex:1"></span>
    <span class="hint">Secuencia</span><select id="labSeq">${opts}</select></div>`);
  box.append(tabs, el(`<div id="labOpts"></div>`), el(`<div id="labOut"></div>`));
  c.replaceChildren(box);

  const ir=(s)=>{ LAB_SUB=s; renderLab(c); };
  $("#tEnz",tabs).addEventListener("click",()=>ir("enzimas"));
  $("#tOrf",tabs).addEventListener("click",()=>ir("orfs"));
  $("#tPri",tabs).addEventListener("click",()=>ir("primers"));

  const opciones=$("#labOpts"), salida=$("#labOut");
  const idx=()=>+$("#labSeq").value;

  if(LAB_SUB==="enzimas"){
    opciones.replaceChildren(el(`<div class="selbar" style="flex-wrap:wrap">
      <span>Enzimas</span><input id="enzList" placeholder="EcoRI,BamHI (vacío = ver todas)"
        style="flex:1;min-width:200px;background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-family:monospace">
      <label class="hint"><input type="checkbox" id="enzCirc"> circular (plásmido)</label>
      <button class="primary" id="goEnz">Analizar</button></div>`));
    $("#goEnz").addEventListener("click",async()=>{
      salida.replaceChildren(el(`<p class="hint">Buscando sitios…</p>`));
      const r=await API.lab_enzymes(idx(), $("#enzList").value, $("#enzCirc").checked);
      if(r.error){ salida.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
      pintarEnzimas(salida,r);
    });
  } else if(LAB_SUB==="orfs"){
    opciones.replaceChildren(el(`<div class="selbar" style="flex-wrap:wrap">
      <label class="hint">Longitud mínima <input id="orfMin" type="number" value="150" min="30" step="30"
        style="width:90px;background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px"> nt</label>
      <label class="hint"><input type="checkbox" id="orfAtg" checked> exigir ATG al inicio</label>
      <button class="primary" id="goOrf">Buscar genes</button></div>`));
    $("#goOrf").addEventListener("click",async()=>{
      salida.replaceChildren(el(`<p class="hint">Recorriendo los seis marcos…</p>`));
      const r=await API.lab_orfs(idx(), +$("#orfMin").value, $("#orfAtg").checked);
      if(r.error){ salida.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
      pintarOrfs(salida,r);
    });
  } else {
    opciones.replaceChildren(el(`<div class="selbar" style="flex-wrap:wrap">
      <label class="hint">Tm objetivo <input id="priTm" type="number" value="60" min="45" max="75"
        style="width:70px;background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px">°C</label>
      <button class="primary" id="goPri">Diseñar pareja</button>
      <span style="flex:1"></span>
      <input id="priF" placeholder="cebador directo" style="width:190px;background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-family:monospace">
      <input id="priR" placeholder="cebador inverso" style="width:190px;background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-family:monospace">
      <button id="goPcr">Simular PCR</button></div>`));
    $("#goPri").addEventListener("click",async()=>{
      salida.replaceChildren(el(`<p class="hint">Diseñando…</p>`));
      const r=await API.lab_primers(idx(), +$("#priTm").value, "", "");
      if(r.error){ salida.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
      pintarPrimers(salida,r);
    });
    $("#goPcr").addEventListener("click",async()=>{
      const f=$("#priF").value.trim(), rv=$("#priR").value.trim();
      if(!f||!rv){ salida.replaceChildren(el(`<div class="err">Escribe los dos cebadores.</div>`)); return; }
      salida.replaceChildren(el(`<p class="hint">Simulando la PCR…</p>`));
      const r=await API.lab_primers(idx(), 60, f, rv);
      if(r.error){ salida.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
      pintarPrimers(salida,r);
    });
  }
}

function pintarEnzimas(out,r){
  const filasCut=r.cuts.map(c=>`<tr><td class="mono">${esc(c.enzyme)}</td><td>${c.position.toLocaleString()}</td></tr>`).join("");
  const filasFrag=r.fragments.map((f,i)=>`<tr><td>${i+1}</td><td>${f.length.toLocaleString()} pb</td><td>${f.start.toLocaleString()}–${f.end.toLocaleString()}</td></tr>`).join("");
  const chips=(lista)=>lista.map(x=>`<span class="tag" style="color:#8ecbff;border-color:#2b4a70">${esc(x)}</span>`).join(" ");
  const cortadores=r.cutters.map(x=>`<span class="tag" title="${x.n} corte(s)" style="color:${x.n===1?'#37d39b':'#93a0bd'};border-color:${x.n===1?'#1d6b52':'var(--line)'}">${esc(x.enzyme)} <b>${x.n}</b></span>`).join(" ");
  out.replaceChildren(el(`<div>
    <div class="cards">
      <div class="card"><div class="k">Longitud</div><div class="v">${r.length.toLocaleString()}</div></div>
      <div class="card"><div class="k">Enzimas que cortan</div><div class="v">${r.cutters.length}</div></div>
      <div class="card"><div class="k">Cortan 1 sola vez</div><div class="v" style="color:#37d39b">${r.unique.length}</div></div>
      <div class="card"><div class="k">Forma</div><div class="v" style="font-size:16px">${r.circular?"circular":"lineal"}</div></div>
    </div>
    <h3>Cortadores únicos — los útiles para clonar</h3>
    <p class="hint" style="margin:0 0 8px">Abren la secuencia por un solo punto, sin romperla en trozos. Son los que se buscan al planear una clonación.</p>
    <div class="row" style="gap:6px">${r.unique.length?chips(r.unique):'<span class="hint">ninguna</span>'}</div>
    ${r.cuts.length?`
      <h3 style="margin-top:18px">Digestión con ${esc(r.selected.join(" + "))}</h3>
      <p class="hint" style="margin:0 0 8px">${r.cuts.length} cortes → <b>${r.n_fragments} fragmentos</b>. ${r.circular?"En circular, n cortes dan n fragmentos.":"En lineal, n cortes dan n+1 fragmentos."}</p>
      <div class="row" style="align-items:flex-start;gap:20px">
        <div style="flex:1"><table class="seqtable"><thead><tr><th>Enzima</th><th>Corta en</th></tr></thead><tbody>${filasCut}</tbody></table></div>
        <div style="flex:1"><table class="seqtable"><thead><tr><th>#</th><th>Tamaño</th><th>Posición</th></tr></thead><tbody>${filasFrag}</tbody></table></div>
      </div>`:``}
    <h3 style="margin-top:18px">Todas las que cortan (de ${r.catalog_size} del catálogo)</h3>
    <p class="hint" style="margin:0 0 8px">En verde las que cortan una sola vez. El número es cuántas veces corta.</p>
    <div class="row" style="gap:6px">${cortadores}</div>
  </div>`));
}

function pintarOrfs(out,r){
  if(!r.n_orfs){
    out.replaceChildren(el(`<div class="soon">No se encontró ningún gen candidato con esos ajustes.<br>Prueba a bajar la longitud mínima o a desmarcar "exigir ATG".</div>`));
    return;
  }
  const filas=r.orfs.map((o,i)=>{
    const marca=o.truncated?`<span class="tag" style="color:#ffb454;border-color:#5a4522" title="Llega al final sin señal de parada: el gen podría continuar">truncado</span>`:"";
    return `<tr class="pick" data-i="${i}"><td>${i+1}</td><td class="mono">${o.strand}${Math.abs(o.frame)}</td>`
         + `<td>${o.start.toLocaleString()}–${o.end.toLocaleString()}</td><td>${o.length.toLocaleString()} nt</td>`
         + `<td>${o.n_aa} aa</td><td>${marca}</td></tr>`;
  }).join("");
  const node=el(`<div>
    <div class="cards">
      <div class="card"><div class="k">Genes candidatos</div><div class="v">${r.n_orfs}</div></div>
      <div class="card"><div class="k">El más largo</div><div class="v">${r.orfs[0].n_aa} aa</div></div>
      <div class="card"><div class="k">Secuencia</div><div class="v">${r.length.toLocaleString()} pb</div></div>
    </div>
    <p class="hint">El marco indica hebra y punto de arranque: <b>+1/+2/+3</b> en la hebra directa, <b>−1/−2/−3</b> en la inversa. Haz clic en una fila para ver la proteína.</p>
    <table class="seqtable"><thead><tr><th>#</th><th>Marco</th><th>Posición</th><th>Largo</th><th>Proteína</th><th></th></tr></thead><tbody>${filas}</tbody></table>
    <div id="orfDet"></div>
  </div>`);
  out.replaceChildren(node);
  node.querySelectorAll("tbody tr").forEach(tr=>tr.addEventListener("click",()=>{
    const o=r.orfs[+tr.dataset.i];
    $("#orfDet",node).replaceChildren(el(`<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <h3>Proteína del ORF ${o.strand}${Math.abs(o.frame)} · ${o.n_aa} aminoácidos</h3>
      <div class="row" style="gap:6px;margin:6px 0">${aaLegend()}</div>
      <div class="seqbox mono">${colorProtein(o.protein)}</div></div>`));
  }));
}

function pintarPrimers(out,r){
  const ficha=(t,p)=>`<div class="card" style="min-width:250px">
     <div class="k">${t}</div>
     <div class="mono" style="font-size:14px;margin:6px 0;word-break:break-all">${esc(p.seq)}</div>
     <div class="hint">${p.len} nt · Tm <b>${p.tm}°C</b> · GC ${p.gc}%</div>
     ${(p.warnings&&p.warnings.length)?p.warnings.map(w=>`<div class="hint" style="color:#ffb454">⚠ ${esc(w)}</div>`).join(""):`<div class="hint" style="color:#37d39b">✓ sin pegas</div>`}
   </div>`;
  if(r.mode==="pcr"){
    const filas=r.products.map(p=>`<tr><td>${p.start.toLocaleString()}–${p.end.toLocaleString()}</td><td>${p.length.toLocaleString()} pb</td></tr>`).join("");
    out.replaceChildren(el(`<div>
      <div class="cards">${ficha("Cebador directo",r.forward)}${ficha("Cebador inverso",r.reverse)}</div>
      <h3>Productos de la PCR</h3>
      ${r.n_products
        ? `<p class="hint" style="margin:0 0 8px">${r.n_products===1?"Un solo producto: lo que se busca.":`<b style="color:#ffb454">${r.n_products} productos</b>: en el gel saldrían varias bandas. Los cebadores pegan en más sitios de los previstos.`}</p>
           <table class="seqtable"><thead><tr><th>Posición</th><th>Tamaño</th></tr></thead><tbody>${filas}</tbody></table>`
        : `<div class="soon">Ningún producto: los cebadores no pegan en esta secuencia.<br>Comprueba que el inverso esté escrito en su propio sentido (5'→3').</div>`}
    </div>`));
    return;
  }
  const dif=r.tm_diff;
  out.replaceChildren(el(`<div>
    <div class="cards">${ficha("Cebador directo",r.forward)}${ficha("Cebador inverso",r.reverse)}</div>
    <p class="hint">Diferencia de Tm entre los dos: <b style="color:${dif<5?'#37d39b':'#ffb454'}">${dif}°C</b> —
      ${dif<5?"bien: por debajo de 5°C los dos se pegan a la vez."
             :"más de 5°C: uno se pegará y el otro no, y la PCR puede fallar."}
      El producto sería de <b>${r.amplicon.toLocaleString()} pb</b>.</p>
    <p class="hint">La Tm se calcula por <b>vecino más próximo</b> (Allawi &amp; SantaLucia), el modelo estándar: tiene en cuenta qué bases están juntas, no solo cuántas G y C hay. Coincide con Biopython a precisión de máquina.</p>
  </div>`));
}

// ── Calidad (QC estilo FastQC) ───────────────────────────────────────────────
async function renderCalidad(c){
  if(!STATE.summary){ c.replaceChildren(el(`<div class="empty"><div class="big">📊</div><div>Carga un FASTQ para ver su informe de calidad.</div></div>`)); return; }
  c.replaceChildren(el(`<h2>Informe de calidad</h2>`),el(`<p class="sub">Calculando…</p>`));
  const q=await API.qc_report();
  if(q.error){ c.replaceChildren(el(`<h2>Informe de calidad</h2>`),el(`<div class="err">${esc(q.error)}</div>`)); return; }
  const cards=el(`<div class="cards"></div>`);
  const card=(k,v)=>cards.append(el(`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`));
  card("Lecturas",q.n_reads.toLocaleString());
  card("Long. media",q.mean_len);
  card("Calidad media","Q"+q.mean_q);
  card("GC",q.gc_overall+"%");
  card("≥Q20",q.pct_q20+"%");
  card("≥Q30",q.pct_q30+"%");
  const body=el(`<div></div>`);
  body.append(el(`<h2>Informe de calidad</h2>`),
              el(`<p class="sub">${esc(q.filename)} · ${q.n_reads.toLocaleString()} lecturas · ${q.min_len}–${q.max_len} nt</p>`),
              explain(`<span class="t">¿Qué es la "calidad"?</span>
                Las máquinas de secuenciación no leen el ADN perfecto: por cada letra apuntan <b>cómo de seguras están</b> de haber acertado. Ese número es la <b>calidad Phred</b> (Q): <b>Q20</b> = 1 error de cada 100; <b>Q30</b> = 1 de cada 1000. Cuanto más alto, mejor. Este informe (estilo FastQC) resume esa fiabilidad:
                <ul>
                  <li><b>Calidad por posición</b> — la calidad media en cada punto de la lectura. Es normal que <b>baje hacia el final</b>.</li>
                  <li><b>Calidad media por lectura</b> — cuántas lecturas hay de cada nivel de calidad.</li>
                  <li><b>Contenido GC</b> — qué porcentaje de las letras son G o C (una huella típica de cada organismo).</li>
                </ul>`),
              cards,
              chartCard("Calidad por posición","La calidad suele caer hacia el final de la lectura. Verde ≥28, amarillo 20–28, rojo <20.",svgQualityLine(q.pos_q_mean)),
              chartCard("Calidad media por lectura","Cada barra: cuántas lecturas tienen esa calidad media.",svgBars(q.meanq_hist,{from:0,to:45,color:"#4f8cff",unit:"Q"})),
              chartCard("Contenido GC por lectura","Cada barra: cuántas lecturas tienen ese % de G+C.",svgBars(q.gc_hist,{from:0,to:100,color:"#37d39b",unit:"%"})));
  c.replaceChildren(body);
}
function chartCard(title,desc,svg){
  return el(`<div style="margin-top:16px"><h3>${esc(title)}</h3>${desc?`<p class="hint" style="margin:0 0 8px">${esc(desc)}</p>`:`<div style="height:8px"></div>`}<div class="chart">${svg}</div></div>`);
}
function svgQualityLine(vals){
  const w=720,h=230,L=42,B=30,T=12,R=14,ymax=42,n=vals.length;
  if(!n) return `<p class="hint">sin datos</p>`;
  const X=i=>L+i*(w-L-R)/Math.max(n-1,1), Y=v=>T+(ymax-v)*(h-T-B)/ymax;
  const band=(a,b,col)=>`<rect x="${L}" y="${Y(b).toFixed(1)}" width="${w-L-R}" height="${(Y(a)-Y(b)).toFixed(1)}" fill="${col}" opacity="0.10"/>`;
  const yt=[0,10,20,30,40].map(v=>`<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${w-R}" y2="${Y(v).toFixed(1)}" stroke="#26314c"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" fill="#93a0bd" font-size="11" text-anchor="end">${v}</text>`).join("");
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">
    ${band(0,20,"#ff6b6b")}${band(20,28,"#ffb454")}${band(28,42,"#37d39b")}${yt}
    <polyline points="${pts}" fill="none" stroke="#7fb0ff" stroke-width="2"/>
    <text x="${w/2}" y="${h-4}" fill="#93a0bd" font-size="11" text-anchor="middle">posición en la lectura</text>
  </svg>`;
}
function svgBars(hist,opts){
  const from=opts.from||0, to=Math.min(opts.to??hist.length-1,hist.length-1);
  let vals=hist.slice(from,to+1);
  let lo=0; while(lo<vals.length-1&&vals[lo]===0) lo++;
  let hi=vals.length-1; while(hi>lo&&vals[hi]===0) hi--;
  const off=from+lo; vals=vals.slice(lo,hi+1);
  const n=vals.length||1, w=720,h=170,L=42,B=26,T=10,R=14, max=Math.max(...vals,1), bw=(w-L-R)/n;
  const bars=vals.map((v,i)=>{const bh=(v/max)*(h-T-B);return `<rect x="${(L+i*bw+1).toFixed(1)}" y="${(h-B-bh).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${bh.toFixed(1)}" fill="${opts.color||"#4f8cff"}" opacity="0.85"/>`;}).join("");
  const lab=i=>`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${h-8}" fill="#93a0bd" font-size="11" text-anchor="middle">${off+i}${opts.unit||""}</text>`;
  const xl=[...new Set([0,Math.floor(n/2),n-1])].map(lab).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">${bars}${xl}</svg>`;
}

// ── Nanoporo (señal → bases) ─────────────────────────────────────────────────
let SIGNALS=null;   // señal de nanoporo cargada
async function renderNanoporo(c){
  const box=el(`<div></div>`);
  box.append(el(`<h2>Nanoporo · señal → bases</h2>`),
    el(`<p class="sub">Carga la señal eléctrica cruda (POD5/FAST5) y conviértela en bases con nuestro basecaller propio.</p>`),
    explain(`<span class="t">¿Qué es esto?</span>
      Un secuenciador de <b>nanoporo</b> (como los MinION de Oxford Nanopore) hace pasar la hebra de ADN por un poro diminuto y mide la <b>corriente eléctrica</b>: cada grupo de letras que pasa la altera de una forma distinta. El resultado es una señal ondulada (el <b>squiggle</b>).
      <ul>
        <li>Convertir esa señal en letras se llama <b>basecalling</b>.</li>
        <li>Nuestro basecaller lo hace con <b>matemáticas puras (Viterbi), sin IA ni GPU</b> — acierta ~74% en datos reales R9.4. Los profesionales (Dorado) llegan al ~99% con redes neuronales; esa diferencia la contamos con honestidad.</li>
        <li>Al final puedes pulsar <b>"Usar en las otras pestañas"</b> para analizar esas bases como cualquier secuencia.</li>
      </ul>`));
  const bar=el(`<div class="row"><button class="primary" id="openSig">Abrir señal…</button>
    ${SIGNALS?`<span class="hint">${esc(SIGNALS.filename)} · ${SIGNALS.n} lectura(s)</span>`:``}</div>`);
  box.append(bar);
  c.replaceChildren(box);
  $("#openSig").addEventListener("click",async()=>{
    const r=await API.pick_and_open_signal();
    if(r.cancelled) return;
    if(r.error){ box.append(el(`<div class="err">${esc(r.error)}</div>`)); return; }
    SIGNALS=r; renderNanoporo(c);
  });
  if(!SIGNALS){
    box.append(el(`<div class="soon">Sin señal cargada. Prueba con <b>ejemplos/senal_nanoporo_1.fast5</b>.<br>La primera vez puede pedir instalar el lector de señal (pod5/h5py).</div>`));
    return;
  }
  const rows=SIGNALS.reads.map(rd=>`<tr class="pick" data-i="${rd.index}"><td>${rd.index}</td><td class="mono">${esc(rd.read_id.slice(0,26))}…</td><td>${rd.samples.toLocaleString()}</td></tr>`).join("");
  const table=el(`<table class="seqtable"><thead><tr><th>#</th><th>ID de lectura</th><th>Muestras</th></tr></thead><tbody>${rows}</tbody></table>`);
  box.append(el(`<p class="hint" style="margin-top:14px">Haz clic en una lectura para basecallearla (tarda unos segundos: es cálculo real):</p>`),table,el(`<div id="bcOut"></div>`));
  table.querySelectorAll("tbody tr").forEach(tr=>tr.addEventListener("click",()=>doBasecall(+tr.dataset.i)));
}
async function doBasecall(index){
  const out=$("#bcOut"); if(!out)return;
  out.replaceChildren(el(`<p class="hint">Basecalling… (unos segundos)</p>`));
  const r=await API.basecall_read(index);
  if(r.error){ out.replaceChildren(el(`<div class="err">${esc(r.error)}</div>`)); return; }
  const node=el(`
    <div style="margin-top:10px">
      <div class="cards">
        <div class="card"><div class="k">Bases obtenidas</div><div class="v">${r.n_bases}</div></div>
        <div class="card"><div class="k">Muestras</div><div class="v">${r.n_samples.toLocaleString()}</div></div>
      </div>
      <h3>Señal medida (squiggle)</h3><div class="chart">${svgSignal(r.signal)}</div>
      <div class="row" style="margin-top:14px"><h3 style="margin:0;flex:1">Bases</h3>
        <button class="primary" id="addSeq" title="Lo añade como un genoma más, para alinearlo o analizarlo">Usar en las otras pestañas →</button></div>
      <div class="seqbox mono">${esc(r.bases)}</div>
      <p class="hint">Basecaller clásico (Viterbi, NumPy puro, sin IA). ~74% de acierto en R9.4 real; llegar al 99% de Dorado exige una red neuronal.</p>
    </div>`);
  out.replaceChildren(node);
  $("#addSeq",node).addEventListener("click",async()=>{
    STATE.workspace=await API.add_sequence("basecall_"+r.read_id.slice(0,8),r.bases);
    STATE.summary=await API.summary();
    renderTabs(); VIEW="secuencias"; setActiveNav("secuencias"); render();
  });
}
function svgSignal(vals){
  const w=720,h=170,L=42,B=22,T=10,R=14,n=vals.length; if(!n) return "";
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const X=i=>L+i*(w-L-R)/Math.max(n-1,1), Y=v=>T+(mx-v)*(h-T-B)/rng;
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">
    <polyline points="${pts}" fill="none" stroke="#37d39b" stroke-width="1.3"/>
    <text x="${w/2}" y="${h-4}" fill="#93a0bd" font-size="11" text-anchor="middle">corriente (pA) a lo largo de las primeras muestras</text></svg>`;
}

// ── Evolución (predecir mutaciones + filtro de realidad) ─────────────────────
async function renderEvolucion(c){
  if(!STATE.summary){ c.replaceChildren(el(`<div class="empty"><div class="big">🧬</div><div>Carga una proteína a lo largo del tiempo (prueba <b>ejemplos/evolucion_proteina.fasta</b>).</div></div>`)); return; }
  c.replaceChildren(el(`<h2>Evolución</h2>`),el(`<p class="sub">Calculando…</p>`));
  const r=await API.predict_mutations(15);
  const box=el(`<div></div>`);
  box.append(el(`<h2>Evolución · ¿qué mutaciones subirán?</h2>`),
    el(`<p class="sub">A partir de muchas secuencias de la MISMA proteína a lo largo del tiempo.</p>`),
    explain(`<span class="t">¿Qué hace esto?</span>
      Los virus y organismos <b>mutan</b> con el tiempo: cambian letras de sus proteínas. Algunas de esas mutaciones se extienden por la población y otras desaparecen. Aquí intentamos <b>ordenar qué mutaciones tienen más probabilidad de aumentar</b>.
      <ul>
        <li><b>Score</b> — prioridad relativa que le da el modelo (más alto = más "sospechosa" de subir).</li>
        <li><b>Nueva</b> — mutación que aún no se había visto en el histórico.</li>
        <li><b>¿Sobreviviría X?</b> — abajo puedes preguntar por una mutación concreta y ver si tiene tracción real (<b>OBSERVADO</b> = ya circuló, es evidencia; <b>ESTIMADO</b> = solo una conjetura del modelo).</li>
      </ul>
      Aviso honesto: predecir evolución es <b>de lo más difícil que hay</b>. Nuestro modelo apenas supera al azar en lo verdaderamente nuevo — lo mostramos tal cual, sin vender una bola de cristal.`));
  if(r.error){ box.append(el(`<div class="err">${esc(r.error)}</div>`)); c.replaceChildren(box); return; }
  box.append(el(`<p class="hint" style="margin:0 0 10px">Sobre ${r.n_sequences} secuencias. "Score" = prioridad relativa; "nueva" = aún no vista en el histórico.</p>`));
  const rows=r.mutations.map((m,i)=>`<tr><td>${i+1}</td><td class="mono" style="font-size:15px">sitio ${m.site} → <b style="color:${aaColor(m.allele)}">${esc(m.allele)}</b></td><td>${m.score.toFixed(2)}</td><td>${m.novel?'<span class="tag" style="color:#ffb454;border-color:#5a4522">nueva</span>':''}</td></tr>`).join("");
  box.append(el(`<table class="seqtable"><thead><tr><th>#</th><th>Mutación (sitio → aminoácido)</th><th>Score</th><th></th></tr></thead><tbody>${rows}</tbody></table>`));
  // ── filtro de realidad ──
  box.append(el(`<h3 style="margin-top:22px">¿Sobreviviría una mutación concreta?</h3>`),
    el(`<p class="hint" style="margin:0 0 8px">Escribe una mutación (p. ej. <b>K21E</b>: la K de la posición 21 pasa a E) y mira si tiene tracción real en el histórico.</p>`));
  const cbar=el(`<div class="selbar"><input id="mutIn" placeholder="ej. K21E" style="background:#0b0f1a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-family:monospace;width:120px"><button class="primary" id="mutBtn">Comprobar</button></div>`);
  box.append(cbar,el(`<div id="mutOut"></div>`));
  c.replaceChildren(box);
  const run=async()=>{
    const m=$("#mutIn").value.trim(); if(!m)return;
    const o=$("#mutOut"); o.replaceChildren(el(`<p class="hint">Comprobando…</p>`));
    const v=await API.check_mutation(m);
    if(v.error){ o.replaceChildren(el(`<div class="err">${esc(v.error)}</div>`)); return; }
    const prob=v.probability==null?"—":Math.round(v.probability*100)+"%";
    const tiercol=v.tier==="OBSERVADO"?"#37d39b":"#ffb454";
    o.replaceChildren(el(`<div class="chart" style="margin-top:4px">
      <div style="font-size:17px"><b>${esc(v.mutation)}</b> · <span style="color:${tiercol}">${esc(v.tier)}</span></div>
      <div style="margin:6px 0"><b>Probabilidad de arraigar: ${prob}</b></div>
      <div>${esc(v.label)}</div>
      <p class="hint" style="margin-top:8px">OBSERVADO = ya circuló (evidencia real) · ESTIMADO = conjetura del modelo. ${v.note?esc(v.note):''}</p></div>`));
  };
  $("#mutBtn",cbar).addEventListener("click",run);
  $("#mutIn",cbar).addEventListener("keydown",e=>{ if(e.key==="Enter")run(); });
}

function soon(title,desc){
  return el(`<div><h2>${esc(title)}</h2><p class="sub">${esc(desc)}</p>
    <div class="soon">En construcción — próxima versión de la app.<br>El motor ya lo hace; falta la cara gráfica.</div></div>`);
}
